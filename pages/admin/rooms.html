<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooms — Silverline Resort Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="admin-page">

<div class="admin-sidebar-backdrop" id="sidebar-backdrop"></div>

<nav class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
  <div class="admin-sidebar-brand">
    <a href="/admin/dashboard" aria-label="Silverline Resort Admin Dashboard">
      <span class="admin-brand-name">Silverline</span>
      <span class="admin-brand-label">Resort Administration</span>
    </a>
  </div>
  <div class="admin-nav">
    <div class="admin-nav-section">
      <div class="admin-nav-label">Overview</div>
      <a href="/admin/dashboard" class="admin-nav-link" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/admin/calendar" class="admin-nav-link" id="nav-calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar
      </a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-label">Reservations</div>
      <a href="/admin/reservations" class="admin-nav-link" id="nav-reservations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Reservations
        <span class="admin-nav-badge" id="nav-pending-count" style="display:none;"></span>
      </a>
      <a href="/admin/guests" class="admin-nav-link" id="nav-guests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Guests
      </a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-label">Inventory</div>
      <a href="/admin/rooms" class="admin-nav-link is-active" id="nav-rooms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Rooms
      </a>
    </div>
    <div class="admin-nav-section">
      <div class="admin-nav-label">System</div>
      <a href="/admin/settings" class="admin-nav-link" id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </div>
  </div>
  <div class="admin-sidebar-footer">
    <div class="admin-user-meta">
      <div class="admin-user-avatar" id="user-avatar">A</div>
      <div>
        <div class="admin-user-name" id="user-name">Loading…</div>
        <div class="admin-user-role" id="user-role">—</div>
      </div>
    </div>
    <button class="admin-logout-btn" id="logout-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign Out
    </button>
    <a href="/" style="display:block; font-size:0.72rem; color:var(--stone); text-decoration:none; margin-top:0.5rem; text-align:center;">View Website</a>
  </div>
</nav>

<div class="admin-main">
  <header class="admin-topbar" role="banner">
    <div class="admin-topbar-left">
      <button class="admin-menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <h1 class="admin-page-title">Room Inventory</h1>
        <div class="admin-page-subtitle">All room types and pricing</div>
      </div>
    </div>
    <div class="admin-topbar-right">
      <button class="btn-admin btn-admin-primary" id="btn-add-room">Add Room</button>
    </div>
  </header>

  <div class="admin-content">
    <div id="rooms-loader" class="admin-loader"><div class="admin-spinner" aria-label="Loading…"></div></div>
    <div id="rooms-grid" class="admin-rooms-grid"></div>
  </div>
</div>

<!-- Edit Room Modal -->
<div class="admin-modal" id="room-modal" style="display:none; position:fixed; inset:0; z-index:999; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
  <div class="admin-modal-content" style="background:var(--charcoal); padding:2rem; width:100%; max-width:600px; border-radius:4px; max-height:90vh; overflow-y:auto;">
    <h2 id="modal-title" style="margin-top:0;">Edit Room</h2>
    <form id="room-form">
      <input type="hidden" id="room-id">
      <div style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Name</label>
        <input type="text" id="room-name" class="admin-input" required>
      </div>
      <div style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Image Path or URL</label>
        <input type="text" id="room-image" class="admin-input" required placeholder="/images/room-xyz.jpg">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">
        <div>
          <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Base Price (₹)</label>
          <input type="number" id="room-price" class="admin-input" required min="500">
        </div>
        <div>
          <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Inventory Count</label>
          <input type="number" id="room-inventory" class="admin-input" required min="0">
        </div>
      </div>
      <div style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Short Description</label>
        <textarea id="room-desc" class="admin-input" rows="2"></textarea>
      </div>
      <div style="margin-bottom:1rem;">
        <label style="display:block; margin-bottom:0.5rem; font-size:0.8rem; color:var(--stone);">Active Status</label>
        <select id="room-active" class="admin-input">
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
        <button type="button" class="btn-admin btn-admin-ghost" id="btn-cancel-room">Cancel</button>
        <button type="submit" class="btn-admin btn-admin-primary" id="btn-save-room">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="admin-toast-container" id="toast-container" aria-live="polite" role="region" aria-label="Notifications"></div>

<script src="/js/admin/auth.js"></script>
<script src="/js/admin/rooms.js"></script>
</body>
</html>
